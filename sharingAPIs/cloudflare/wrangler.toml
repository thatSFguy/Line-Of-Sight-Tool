name = "los-collab-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# After running: wrangler kv:namespace create "LOS_DATA"
# Copy the id here:
[[kv_namespaces]]
binding = "LOS_DATA"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# Optional: Add a preview namespace for testing
# Run: wrangler kv:namespace create "LOS_DATA" --preview
# [[kv_namespaces]]
# binding = "LOS_DATA"
# id = "YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"
